<!DOCTYPE html>
<html>
<head>
    <title>D300 LiDAR Web Viewer</title>
    <script src="http://localhost:9090/roslib.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 20px;
            background: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .info-panel {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            width: 800px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            font-size: 12px;
            color: #ccc;
        }
        #lidar-canvas {
            border: 2px solid #444;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-panel">
            <h2>D300 LiDAR Real-Time Viewer</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="point-count">0</div>
                    <div class="stat-label">Points</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="min-distance">0.00</div>
                    <div class="stat-label">Min Distance (m)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="max-distance">0.00</div>
                    <div class="stat-label">Max Distance (m)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="frame-rate">0</div>
                    <div class="stat-label">FPS</div>
                </div>
            </div>
        </div>
        <div id="lidar-canvas"></div>
    </div>

    <script>
        // ROS connection
        const ros = new ROSLIB.Ros({
            url: 'ws://localhost:9090'
        });

        ros.on('connection', () => {
            console.log('Connected to ROS');
            document.body.style.backgroundColor = '#1e3d1e';
        });

        ros.on('error', (error) => {
            console.log('Error connecting to ROS: ', error);
            document.body.style.backgroundColor = '#3d1e1e';
        });

        ros.on('close', () => {
            console.log('Connection to ROS closed');
            document.body.style.backgroundColor = '#1e1e1e';
        });

        // LiDAR topic
        const lidarTopic = new ROSLIB.Topic({
            ros: ros,
            name: '/scan',
            messageType: 'sensor_msgs/LaserScan'
        });

        // LiDAR data storage
        let currentRanges = [];
        let currentAngles = [];
        let pointCount = 0;
        let frameCount = 0;
        let lastTime = Date.now();
        let fps = 0;

        // p5.js sketch
        function setup() {
            const canvas = createCanvas(800, 600);
            canvas.parent('lidar-canvas');
            frameRate(30);
        }

        function draw() {
            background(30, 30, 30);
            
            // Calculate FPS
            frameCount++;
            if (Date.now() - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = Date.now();
                document.getElementById('frame-rate').textContent = fps;
            }
            
            // Draw LiDAR data
            drawLidarData();
        }

        function drawLidarData() {
            push();
            translate(width / 2, height / 2);
            
            // Draw grid
            stroke(100, 100, 100, 100);
            strokeWeight(1);
            for (let r = 100; r <= 300; r += 100) {
                noFill();
                ellipse(0, 0, r * 2);
                text(r / 100 + 'm', r + 10, 0);
            }
            
            // Draw axes
            stroke(200, 200, 200);
            line(-350, 0, 350, 0); // X-axis
            line(0, -350, 0, 350); // Y-axis
            
            // Draw LiDAR points
            if (currentRanges.length > 0) {
                let minDist = Infinity;
                let maxDist = 0;
                let validPoints = 0;
                
                for (let i = 0; i < currentRanges.length; i++) {
                    const range = currentRanges[i];
                    const angle = currentAngles[i];
                    
                    if (range > 0.1 && range < 16.0) {
                        validPoints++;
                        minDist = Math.min(minDist, range);
                        maxDist = Math.max(maxDist, range);
                        
                        const x = Math.cos(angle) * range * 100; // Scale for visualization
                        const y = Math.sin(angle) * range * 100;
                        
                        // Color based on distance (red = close, blue = far)
                        const colorVal = map(range, 0.1, 8.0, 255, 100);
                        fill(255, colorVal, colorVal);
                        noStroke();
                        ellipse(x, y, 4, 4);
                    }
                }
                
                // Update statistics
                document.getElementById('point-count').textContent = validPoints;
                document.getElementById('min-distance').textContent = minDist.toFixed(2);
                document.getElementById('max-distance').textContent = maxDist.toFixed(2);
                pointCount = validPoints;
            }
            
            // Draw robot position
            fill(0, 255, 0);
            stroke(0, 200, 0);
            strokeWeight(2);
            ellipse(0, 0, 20, 20);
            
            // Draw front indicator
            stroke(0, 255, 0);
            line(0, 0, 0, -30);
            
            pop();
        }

        // Subscribe to LiDAR data
        lidarTopic.subscribe((message) => {
            currentRanges = message.ranges;
            currentAngles = [];
            
            // Calculate angles for each range measurement
            for (let i = 0; i < message.ranges.length; i++) {
                const angle = message.angle_min + (i * message.angle_increment);
                currentAngles.push(angle);
            }
        });

        // Utility function
        function map(value, start1, stop1, start2, stop2) {
            return start2 + (stop2 - start2) * ((value - start1) / (stop1 - start1));
        }
    </script>
</body>
</html>
